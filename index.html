
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Predictor Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#08111f;color:#f1f5f9;font-family:Arial,sans-serif}
h1{font-size:27px;margin:5px 0;color:#38bdf8}
h2{font-size:19px;margin:0 0 12px}
p{color:#aebed0;line-height:1.5}
.card{background:#142238;border:1px solid #263b56;border-radius:13px;padding:15px;margin:13px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #405675;background:#0b1728;color:white;font-size:15px}
button{background:#087db8;border:0;font-weight:bold;margin-top:12px;font-size:16px}
button:disabled{opacity:.5}
.big{font-size:30px;font-weight:bold;color:#38bdf8}
.muted{color:#9aacc1;font-size:13px}
.good{color:#4ade80}
.bad{color:#fb7185}
.yellow{color:#facc15}
.bar{height:12px;background:#263b56;border-radius:10px;overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:#38bdf8}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 5px;border-bottom:1px solid #30445d;text-align:left}
th{color:#38bdf8}
.result{font-size:18px;font-weight:bold}
#status{color:#facc15;font-size:13px}
.small{font-size:12px;color:#91a5bc}
.injury{padding:10px 0;border-bottom:1px solid #30445d}
.injury:last-child{border-bottom:0}
.tag{display:inline-block;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:bold;background:#334155;margin-top:4px}
.tag.out{background:#7f1d1d;color:#fecaca}
.tag.uncertain{background:#713f12;color:#fde68a}
a{color:#38bdf8}
</style>
</head>
<body>

<h1>🏒 NHL PREDICTOR PRO</h1>
<p>Otteluanalyysi – tilastot, vire ja voittotodennäköisyydet</p>

<div class="card">
<h2>Valitse ottelu</h2>
<div class="teams">
<div>
<label class="muted">KOTIJOUKKUE</label>
<select id="home"></select>
</div>
<div>
<label class="muted">VIERASJOUKKUE</label>
<select id="away"></select>
</div>
</div>
<button id="analyze">ANALYSOI OTTELU</button>
<p id="status">Valitse joukkueet ja käynnistä analyysi.</p>
</div>

<div id="output"></div>

<script>
const NHL_API="https://api-web.nhle.com/v1";
const NHL_PROXY="https://proxy.cors.dev/";
const ESPN_INJURIES="https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/injuries";

const teams=[
["ANA","Anaheim Ducks"],
["BOS","Boston Bruins"],
["BUF","Buffalo Sabres"],
["CGY","Calgary Flames"],
["CAR","Carolina Hurricanes"],
["CHI","Chicago Blackhawks"],
["COL","Colorado Avalanche"],
["CBJ","Columbus Blue Jackets"],
["DAL","Dallas Stars"],
["DET","Detroit Red Wings"],
["EDM","Edmonton Oilers"],
["FLA","Florida Panthers"],
["LAK","Los Angeles Kings"],
["MIN","Minnesota Wild"],
["MTL","Montreal Canadiens"],
["NSH","Nashville Predators"],
["NJD","New Jersey Devils"],
["NYI","New York Islanders"],
["NYR","New York Rangers"],
["OTT","Ottawa Senators"],
["PHI","Philadelphia Flyers"],
["PIT","Pittsburgh Penguins"],
["SJS","San Jose Sharks"],
["SEA","Seattle Kraken"],
["STL","St. Louis Blues"],
["TBL","Tampa Bay Lightning"],
["TOR","Toronto Maple Leafs"],
["UTA","Utah Mammoth"],
["VAN","Vancouver Canucks"],
["VGK","Vegas Golden Knights"],
["WSH","Washington Capitals"],
["WPG","Winnipeg Jets"]
];

const homeSelect=document.getElementById("home");
const awaySelect=document.getElementById("away");

teams.forEach(t=>{
 const o1=document.createElement("option");
 o1.value=t[0];
 o1.textContent=t[1];
 const o2=o1.cloneNode(true);
 homeSelect.appendChild(o1);
 awaySelect.appendChild(o2);
});

homeSelect.value="WPG";
awaySelect.value="NJD";

function teamName(code){
 const t=teams.find(x=>x[0]===code);
 return t?t[1]:code;
}

async function fetchNHL(path){
 const response=await fetch(NHL_PROXY+NHL_API+path,{
  method:"GET",
  credentials:"omit"
 });
 if(!response.ok) throw new Error("NHL API HTTP "+response.status);
 return response.json();
}

/* ESPN: julkinen NHL-loukkaantumisraportti.
   Tyhjä tai tuntematon vastaus EI tarkoita tervettä joukkuetta. */
async function fetchInjuries(){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),12000);

 try{
  const response=await fetch(ESPN_INJURIES,{
   method:"GET",
   credentials:"omit",
   signal:controller.signal
  });

  if(!response.ok){
   throw new Error("ESPN HTTP "+response.status);
  }

  const data=await response.json();
  return parseInjuries(data);
 }finally{
  clearTimeout(timer);
 }
}

function textValue(value){
 if(value===null||value===undefined)return "";
 if(typeof value==="string"||typeof value==="number")return String(value);
 if(typeof value==="object"){
  return value.displayName||value.name||value.abbreviation||value.description||"";
 }
 return "";
}

function parseInjuries(data){
 const found=[];
 const seen=new Set();

 function walk(node,inheritedTeam){
  if(!node||typeof node!=="object")return;

  if(Array.isArray(node)){
   node.forEach(item=>walk(item,inheritedTeam));
   return;
  }

  const teamObject=node.team||node.teamInfo||{};
  const teamCode=
   textValue(teamObject.abbreviation)||
   textValue(teamObject.shortDisplayName)||
   textValue(node.teamAbbreviation)||
   inheritedTeam||
   "";

  const athlete=node.athlete||node.player||{};
  const injury=node.injury||node;

  if(Object.keys(athlete).length){
   const name=
    textValue(athlete.displayName)||
    textValue(athlete.fullName)||
    textValue(athlete.name);

   const status=
    textValue(injury.status)||
    textValue(node.status)||
    textValue(node.injuryStatus);

   const position=
    textValue(athlete.position);

   const type=
    textValue(injury.type)||
    textValue(injury.details)||
    textValue(injury.description)||
    textValue(node.description);

   const comment=
    textValue(injury.longComment)||
    textValue(injury.shortComment)||
    textValue(node.description);

   if(name&&status){
    const key=[name,teamCode,status].join("|").toLowerCase();

    if(!seen.has(key)){
     seen.add(key);
     found.push({
      name,
      teamCode,
      teamName:
       textValue(teamObject.displayName)||
       textValue(teamObject.name),
      status,
      position,
      type,
      comment,
      date:
       textValue(injury.date)||
       textValue(injury.updateDate)||
       textValue(node.date)
     });
    }
   }
  }

  for(const [key,value] of Object.entries(node)){
   if(value&&typeof value==="object"){
    walk(value,teamCode);
   }
  }
 }

 walk(data,"");

 return found;
}

function normalize(value){
 return String(value||"")
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");
}

function injuryBelongsToTeam(injury,code){
 const aliases={
  ANA:["ana","anaheimducks"],
  BOS:["bos","bostonbruins"],
  BUF:["buf","buffalosabres"],
  CGY:["cgy","calgaryflames"],
  CAR:["car","carolinahurricanes"],
  CHI:["chi","chicagoblackhawks"],
  COL:["col","coloradoavalanche"],
  CBJ:["cbj","columbusbluejackets"],
  DAL:["dal","dallasstars"],
  DET:["det","detroitredwings"],
  EDM:["edm","edmontonoilers"],
  FLA:["fla","floridapanthers"],
  LAK:["lak","losangeleskings"],
  MIN:["min","minnesotawild"],
  MTL:["mtl","montrealcanadiens"],
  NSH:["nsh","nashvillepredators"],
  NJD:["njd","newjerseydevils"],
  NYI:["nyi","newyorkislanders"],
  NYR:["nyr","newyorkrangers"],
  OTT:["ott","ottawasenators"],
  PHI:["phi","philadelphiaflyers"],
  PIT:["pit","pittsburghpenguins"],
  SJS:["sjs","sanjosesharks"],
  SEA:["sea","seattlekraken"],
  STL:["stl","stlouisblues"],
  TBL:["tbl","tampabaylightning"],
  TOR:["tor","torontomapleleafs"],
  UTA:["uta","utahmammoth"],
  VAN:["van","vancouvercanucks"],
  VGK:["vgk","vegasgoldenknights"],
  WSH:["wsh","washingtoncapitals"],
  WPG:["wpg","winnipegjets"]
 };

 const accepted=aliases[code]||[normalize(code)];
 return accepted.includes(normalize(injury.teamCode))||
        accepted.includes(normalize(injury.teamName));
}

function isConfirmedOut(status){
 const s=normalize(status);
 return s.includes("out")||
        s.includes("injuredreserve")||
        s==="ir"||
        s.includes("suspended")||
        s.includes("seasonending");
}

function isUncertain(status){
 const s=normalize(status);
 return s.includes("daytoday")||
        s.includes("questionable")||
        s.includes("doubtful")||
        s.includes("game-time")||
        s.includes("gtd");
}

function escapeHTML(value){
 return String(value||"").replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[char]));
}

function renderInjuries(allInjuries,code){
 if(!Array.isArray(allInjuries)){
  return "<p class='yellow'>Loukkaantumistietoja ei saatu luettua.</p>";
 }

 const list=allInjuries.filter(x=>injuryBelongsToTeam(x,code));

 if(!list.length){
  return `
   <p class="yellow">ESPN ei palauttanut tälle joukkueelle vahvistettuja loukkaantumistietoja.</p>
   <p class="small">
    Tämä ei tarkoita, että kaikki pelaajat olisivat pelikunnossa.
    Tietoa ei käytetä ennusteen muuttamiseen.
   </p>`;
 }

 return list.map(player=>{
  const out=isConfirmedOut(player.status);
  const uncertain=isUncertain(player.status);
  const tagClass=out?"out":uncertain?"uncertain":"";
  const tagText=out?"POISSAOLO":uncertain?"EPÄVARMA":"ESPN:N ILMOITTAMA";

  return `
   <div class="injury">
    <strong>${escapeHTML(player.name)}</strong>
    <div class="small">
     ${escapeHTML(player.position||"Pelipaikkaa ei ilmoitettu")}
     ${player.type?" · "+escapeHTML(player.type):""}
    </div>
    <span class="tag ${tagClass}">${tagText}: ${escapeHTML(player.status)}</span>
    ${player.comment?`<p class="small">${escapeHTML(player.comment)}</p>`:""}
    ${player.date?`<p class="small">Päivitys/lähteen päiväys: ${escapeHTML(player.date)}</p>`:""}
   </div>`;
 }).join("");
}

function isFinished(game){
 const state=String(game.gameState||"").toUpperCase();
 return state==="FINAL"||state==="OFF";
}

function gameStats(game,code){
 const isHome=game.homeTeam?.abbrev===code;
 const own=isHome?game.homeTeam:game.awayTeam;
 const opponent=isHome?game.awayTeam:game.homeTeam;

 return {
  date:game.gameDate||"",
  opponent:opponent?.abbrev||"?",
  goals:Number(own?.score||0),
  against:Number(opponent?.score||0),
  home:isHome
 };
}

function average(list,key){
 if(!list.length)return 0;
 return list.reduce((sum,item)=>sum+item[key],0)/list.length;
}

function winRate(list){
 if(!list.length)return 50;
 let points=0;
 list.forEach(game=>{
  if(game.goals>game.against)points++;
  else if(game.goals===game.against)points+=0.5;
 });
 return points/list.length*100;
}

function pct(value){
 return Math.round(value)+" %";
}

function clamp(value,min,max){
 return Math.max(min,Math.min(max,value));
}

function restDays(list){
 if(!list.length)return null;
 const lastDate=new Date(list[0].date+"T12:00:00");
 const now=new Date();
 return Math.max(0,Math.floor((now-lastDate)/86400000));
}

function renderHistory(list){
 if(!list.length)return "<p>Ottelutietoja ei löytynyt.</p>";

 return `
 <table>
 <tr><th>Päivä</th><th>Vastustaja</th><th>Tulos</th><th>Tulos</th></tr>
 ${list.map(game=>{
  const won=game.goals>game.against;
  const lost=game.goals<game.against;
  return `
   <tr>
    <td>${escapeHTML(game.date)}</td>
    <td>${escapeHTML(teamName(game.opponent))}</td>
    <td>${game.goals}–${game.against}</td>
    <td class="${won?"good":lost?"bad":"yellow"}">
     ${won?"VOITTO":lost?"TAPPIO":"TASAN"}
    </td>
   </tr>`;
 }).join("")}
 </table>`;
}

function findStanding(standings,code){
 return standings.find(item=>
  item.teamAbbrev?.default===code||
  item.teamAbbrev===code
 );
}

function safeNumber(value){
 const n=Number(value);
 return Number.isFinite(n)?n:0;
}

async function analyze(){
 const h=homeSelect.value;
 const a=awaySelect.value;
 const status=document.getElementById("status");
 const output=document.getElementById("output");
 const button=document.getElementById("analyze");

 if(h===a){
  status.textContent="Valitse kaksi eri joukkuetta.";
  return;
 }

 button.disabled=true;
 output.innerHTML="";
 status.textContent="Haetaan NHL:n ottelutilastoja ja ESPN:n loukkaantumistietoja...";

 try{
  const [homeData,awayData,standingsData]=await Promise.all([
   fetchNHL("/club-schedule-season/"+h+"/now"),
   fetchNHL("/club-schedule-season/"+a+"/now"),
   fetchNHL("/standings/now")
  ]);

  let injuries=[];
  let injuryError="";

  try{
   injuries=await fetchInjuries();
  }catch(error){
   injuryError=String(error.message||error);
  }

  const homeGames=(homeData.games||[])
   .filter(isFinished)
   .map(game=>gameStats(game,h))
   .sort((x,y)=>y.date.localeCompare(x.date));

  const awayGames=(awayData.games||[])
   .filter(isFinished)
   .map(game=>gameStats(game,a))
   .sort((x,y)=>y.date.localeCompare(x.date));

  const home5=homeGames.slice(0,5);
  const away5=awayGames.slice(0,5);
  const home10=homeGames.slice(0,10);
  const away10=awayGames.slice(0,10);

  const homeAtHome=homeGames.filter(game=>game.home).slice(0,10);
  const awayOnRoad=awayGames.filter(game=>!game.home).slice(0,10);

  const h2h=(homeData.games||[])
   .filter(game=>{
    const home=game.homeTeam?.abbrev;
    const away=game.awayTeam?.abbrev;
    return (home===h&&away===a)||(home===a&&away===h);
   })
   .filter(isFinished)
   .sort((x,y)=>y.gameDate.localeCompare(x.gameDate))
   .slice(0,5);

  const standings=standingsData.standings||[];
  const hs=findStanding(standings,h);
  const as=findStanding(standings,a);

  const hRecent=winRate(home10);
  const aRecent=winRate(away10);
  const hHome=winRate(homeAtHome);
  const aAway=winRate(awayOnRoad);

  const hGoals=average(home10,"goals");
  const aGoals=average(away10,"goals");
  const hAgainst=average(home10,"against");
  const aAgainst=average(away10,"against");

  let h2hHomeWins=0;
  let h2hAwayWins=0;

  const h2hHistory=h2h.map(game=>{
   const homeCode=game.homeTeam?.abbrev;
   const selectedHomeGoals=Number(
    homeCode===h?game.homeTeam.score:game.awayTeam.score
   );
   const selectedAwayGoals=Number(
    homeCode===a?game.homeTeam.score:game.awayTeam.score
   );

   if(selectedHomeGoals>selectedAwayGoals)h2hHomeWins++;
   if(selectedAwayGoals>selectedHomeGoals)h2hAwayWins++;

   return {
    date:game.gameDate,
    opponent:a,
    goals:selectedHomeGoals,
    against:selectedAwayGoals
   };
  });

  let homeScore=50;
  homeScore+=(hRecent-aRecent)*0.22;
  homeScore+=(hHome-aAway)*0.18;
  homeScore+=(hGoals-aGoals)*3;
  homeScore+=(aAgainst-hAgainst)*2;
  homeScore+=4;

  if(hs&&as){
   const homePoints=safeNumber(hs.points);
   const awayPoints=safeNumber(as.points);
   const homeGP=Math.max(1,safeNumber(hs.gamesPlayed));
   const awayGP=Math.max(1,safeNumber(as.gamesPlayed));
   homeScore+=(homePoints/homeGP-awayPoints/awayGP)*1.5;
  }

  if(h2hHistory.length){
   homeScore+=(h2hHomeWins-h2hAwayWins)*1.5;
  }

  homeScore=clamp(homeScore,15,85);
  const awayScore=100-homeScore;

  const hRest=restDays(homeGames);
  const aRest=restDays(awayGames);
  const hName=teamName(h);
  const aName=teamName(a);
  const favorite=homeScore>=50?hName:aName;

  const hInjuries=injuries.filter(x=>injuryBelongsToTeam(x,h));
  const aInjuries=injuries.filter(x=>injuryBelongsToTeam(x,a));

  output.innerHTML=`

  <div class="card">
   <h2>🏆 OTTELUENNUSTE</h2>
   <div class="teams">
    <div>
     <div class="muted">${hName}</div>
     <div class="big">${pct(homeScore)}</div>
    </div>
    <div>
     <div class="muted">${aName}</div>
     <div class="big">${pct(awayScore)}</div>
    </div>
   </div>
   <div class="bar"><span style="width:${homeScore}%"></span></div>
   <div class="result">${favorite} – ennusteen suosikki</div>
   <p class="small">
    Tilastollinen arvio. Ei varma lopputulos eikä vedonlyöntivihje.
    Loukkaantumistietoja ei ole vielä painotettu prosenttilaskelmassa.
   </p>
  </div>

  <div class="card">
   <h2>🏥 LOUKKAANTUMISET JA POISSAOLOT</h2>
   ${injuryError?`
    <p class="bad">ESPN:n tietojen haku epäonnistui.</p>
    <p class="small">${escapeHTML(injuryError)}</p>
    <p class="small">Poissaoloja ei voida tällä kertaa vahvistaa.</p>
   `:`
    <p class="small">Tietolähde: ESPN:n julkinen NHL-raportti.</p>
    <h3>${hName}</h3>
    ${renderInjuries(injuries,h)}
    <h3>${aName}</h3>
    ${renderInjuries(injuries,a)}
   `}
   <p class="small">
    <a href="https://www.espn.com/nhl/injuries" target="_blank" rel="noopener">
     Avaa ESPN:n NHL-loukkaantumisraportti
    </a>
   </p>
   <p class="small">
    ESPN:n ilmoittamat tiedot eivät aina kerro varmasti, pelaako henkilö
    seuraavassa ottelussa. Varmista kokoonpano ennen ottelua.
   </p>
  </div>

  <div class="card">
   <h2>🧤 MAALIVAHDIT</h2>
   <p class="yellow">
    Aloittavia maalivahteja ei ole tässä versiossa vahvistettu.
    Niitä ei arvata.
   </p>
   <p class="small">
    Maalivahtitietoja ei ole sisällytetty voittotodennäköisyyteen.
   </p>
  </div>

  <div class="card">
   <h2>📊 VIIMEAIKAINEN VIRE</h2>
   <table>
    <tr><th>Tilasto</th><th>${h}</th><th>${a}</th></tr>
    <tr><td>Viimeiset 5</td><td>${pct(winRate(home5))}</td><td>${pct(winRate(away5))}</td></tr>
    <tr><td>Viimeiset 10</td><td>${pct(hRecent)}</td><td>${pct(aRecent)}</td></tr>
    <tr><td>Tehdyt maalit / peli</td><td>${hGoals.toFixed(2)}</td><td>${aGoals.toFixed(2)}</td></tr>
    <tr><td>Päästetyt maalit / peli</td><td>${hAgainst.toFixed(2)}</td><td>${aAgainst.toFixed(2)}</td></tr>
    <tr><td>Päiviä viime pelistä</td><td>${hRest===null?"-":hRest}</td><td>${aRest===null?"-":aRest}</td></tr>
   </table>
  </div>

  <div class="card">
   <h2>🏠 KOTI- JA VIERASVIRE</h2>
   <table>
    <tr><th>Tilasto</th><th>${h}</th><th>${a}</th></tr>
    <tr><td>Kotipelien voitto-osuus</td><td>${pct(hHome)}</td><td>-</td></tr>
    <tr><td>Vierasotteluiden voitto-osuus</td><td>-</td><td>${pct(aAway)}</td></tr>
   </table>
  </div>

  <div class="card">
   <h2>🤝 KESKINÄISET KOHTAAMISET</h2>
   <p>Viimeisimmät löydetyt kohtaamiset: ${h2hHistory.length}</p>
   <p>${hName}: ${h2hHomeWins} voittoa</p>
   <p>${aName}: ${h2hAwayWins} voittoa</p>
   ${renderHistory(h2hHistory)}
  </div>

  <div class="card">
   <h2>📈 SARJATAULUKKO</h2>
   <table>
    <tr><th>Tilasto</th><th>${h}</th><th>${a}</th></tr>
    <tr><td>Pisteet</td><td>${hs?.points??"-"}</td><td>${as?.points??"-"}</td></tr>
    <tr><td>Voitot</td><td>${hs?.wins??"-"}</td><td>${as?.wins??"-"}</td></tr>
    <tr><td>Ottelut</td><td>${hs?.gamesPlayed??"-"}</td><td>${as?.gamesPlayed??"-"}</td></tr>
   </table>
  </div>

  <div class="card">
   <h2>📋 ${hName} – VIIMEISET 10 OTTELUA</h2>
   ${renderHistory(home10)}
  </div>

  <div class="card">
   <h2>📋 ${aName} – VIIMEISET 10 OTTELUA</h2>
   ${renderHistory(away10)}
  </div>

  <div class="card">
   <h2>ℹ️ ENNUSTEEN RAJOITUKSET</h2>
   <p>
    Ennuste huomioi viimeaikaisen vireen, maalinteon, päästetyt maalit,
    koti- ja vierasottelut, sarjataulukon sekä keskinäiset kohtaamiset.
   </p>
   <p>
    Loukkaantumisraportti näytetään erikseen, mutta sen vaikutusta
    prosenttilaskelmaan ei ole vielä mallinnettu.
   </p>
   <p>
    Aloittavia maalivahteja ei ole vahvistettu tässä versiossa.
   </p>
   <p class="small">
    Tilastot haetaan NHL:n rajapinnasta välityspalvelimen kautta.
    Loukkaantumistiedot haetaan ESPN:n julkisesta rajapinnasta.
   </p>
  </div>
  `;

  status.textContent="Analyysi valmis. Loukkaantumistietojen tila näkyy omassa osiossaan.";

 }catch(error){
  status.textContent="Tietojen haku epäonnistui.";
  output.innerHTML=`
   <div class="card">
    <h2>Yhteysvirhe</h2>
    <p>NHL:n ottelutilastoja ei saatu haettua.</p>
    <p class="small">${escapeHTML(error.message)}</p>
    <p>Tarkista verkkoyhteys ja kokeile uudelleen.</p>
   </div>`;
 }finally{
  button.disabled=false;
 }
}

document.getElementById("analyze").addEventListener("click",analyze);
</script>
</body>
</html>
