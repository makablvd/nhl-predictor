
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Predictor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#091321;color:#edf3fa;font-family:Arial,sans-serif;padding:12px}
.wrap{max-width:850px;margin:auto}
h1{font-size:25px;margin:8px 0}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 9px;color:#dbeafe}
.sub,.small,.muted{color:#9aabc0;font-size:12px}
.panel{background:#132238;border:1px solid #293d57;border-radius:13px;padding:14px;margin:12px 0}
.controls,.grid{display:grid;grid-template-columns:1fr;gap:10px}
label{display:block;font-size:12px;color:#b6c6d9;margin-bottom:6px}
select,input[type="date"],button{width:100%;padding:13px;border-radius:8px;border:1px solid #405775;background:#1b304b;color:white;font-size:15px}
button{background:#087f5b;border:0;font-weight:bold;margin-top:12px}
button:disabled{opacity:.5}
.stat{background:#1b304b;border-radius:9px;padding:11px;min-width:0}
.value{font-size:21px;font-weight:bold;margin-top:5px;overflow-wrap:anywhere}
.rank{font-size:26px;color:#fff}
.prob{font-size:30px;font-weight:bold}
.bar{height:9px;background:#30445e;border-radius:10px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:#19b981}
.good{color:#4ade80}.bad{color:#fb7185}.warn{color:#fbbf24}
.status{background:#1b304b;padding:11px;border-radius:8px;margin-top:12px;font-size:13px;color:#cbd5e1}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid #30445e}
th{color:#9aabc0;font-weight:normal}
.injury{padding:10px 0;border-bottom:1px solid #30445e}
.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:#334155;font-size:11px}
.tag.out{background:#7f1d1d;color:#fecaca}
.tag.day{background:#713f12;color:#fde68a}
.note{font-size:12px;line-height:1.5;color:#9aabc0}
.section{border-top:1px solid #30445e;margin-top:15px;padding-top:12px}
@media(max-width:480px){
body{padding:8px}
.panel{padding:11px}
.controls,.grid{gap:7px}
.value{font-size:18px}
.prob{font-size:25px}
td,th{padding:7px 3px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🏒 NHL Predictor</h1>
<div class="sub">Otteluanalyysi · Sarjasijoitukset · Rasitus · Poissaolot</div>

<div class="panel">
<h2>Valitse joukkueet</h2>
<div class="controls">
<div>
<label for="teamA">Kotijoukkue</label>
<select id="teamA"></select>
</div>
<div>
<label for="teamB">Vierasjoukkue</label>
<select id="teamB"></select>
</div>
<div>
<label for="gameDate">Ottelupäivä</label>
<input id="gameDate" type="date">
</div>
</div>
<button id="analyzeBtn" onclick="analyze()">ANALYSOI OTTELU</button>
<div id="status" class="status">Valitse joukkueet ja ottelupäivä.</div>
</div>

<div id="output"></div>

<div class="panel note">
Tietolähteet: NHL:n ottelutilastot ja sarjataulukko sekä ESPN:n julkinen loukkaantumisraportti. Ennuste on tilastollinen arvio. Puuttuvia tietoja ei arvata.
</div>
</div>

<script>
"use strict";

const API="https://api-web.nhle.com/v1";
const PROXY="https://proxy.cors.dev/";
const ESPN="https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/injuries";

const teams=[
["ANA","Anaheim Ducks"],["BOS","Boston Bruins"],["BUF","Buffalo Sabres"],
["CGY","Calgary Flames"],["CAR","Carolina Hurricanes"],["CHI","Chicago Blackhawks"],
["COL","Colorado Avalanche"],["CBJ","Columbus Blue Jackets"],["DAL","Dallas Stars"],
["DET","Detroit Red Wings"],["EDM","Edmonton Oilers"],["FLA","Florida Panthers"],
["LAK","Los Angeles Kings"],["MIN","Minnesota Wild"],["MTL","Montreal Canadiens"],
["NSH","Nashville Predators"],["NJD","New Jersey Devils"],["NYI","New York Islanders"],
["NYR","New York Rangers"],["OTT","Ottawa Senators"],["PHI","Philadelphia Flyers"],
["PIT","Pittsburgh Penguins"],["SJS","San Jose Sharks"],["SEA","Seattle Kraken"],
["STL","St. Louis Blues"],["TBL","Tampa Bay Lightning"],["TOR","Toronto Maple Leafs"],
["UTA","Utah Mammoth"],["VAN","Vancouver Canucks"],["VGK","Vegas Golden Knights"],
["WSH","Washington Capitals"],["WPG","Winnipeg Jets"]
];

const aliases={
LAK:["LAK","LA","LOSANGELESKINGS"],
NJD:["NJD","NJ","NEWJERSEYDEVILS"],
SJS:["SJS","SJ","SANJOSESHARKS"],
TBL:["TBL","TB","TAMPABAYLIGHTNING"]
};

const $=id=>document.getElementById(id);
const name=code=>teams.find(t=>t[0]===code)?.[1]||code;

// Suomen paikallinen päivämäärä, ei UTC-päivämäärä.
const today=()=>{
const d=new Date();
return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");
};

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c]);
}
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;'
,"'":"&#39;"
})[c]);
}

function norm(v){return String(v||"").toUpperCase().replace(/[^A-Z]/g,"")}
function matchesTeam(value,code){
return (aliases[code]||[code]).some(a=>norm(a)===norm(value));
}
function setStatus(v){$("status").textContent=v}

async function fetchNHL(path){
const r=await fetch(PROXY+API+path,{credentials:"omit"});
if(!r.ok)throw Error("NHL-rajapinta: "+r.status);
return r.json();
}

function parseInjuries(data){
const result=[];
const groups=Array.isArray(data?.injuries)?data.injuries:[];
for(const group of groups){
const entries=Array.isArray(group?.injuries)?group.injuries:[];
for(const e of entries){
const a=e?.athlete||{};
if(!a.displayName)continue;
const d=e?.details||{};
const code=a?.team?.abbreviation||group?.abbreviation||group?.team?.abbreviation||"";
const type=e?.type?.abbreviation||"";
const status=e?.status||({
DD:"Day-To-Day",O:"Out",IR:"Injured Reserve",SUSP:"Suspension"
}[type]||type||"Ei ilmoitettu");
result.push({
name:a.displayName,
team:norm(code),
position:a?.position?.abbreviation||"",
status,
detail:[d.type,d.side].filter(Boolean).join(" – ")||e?.shortComment||"",
returnDate:d.returnDate||""
});
}
}
return result;
}

async function fetchInjuries(){
const r=await fetch(ESPN,{credentials:"omit"});
if(!r.ok)throw Error("ESPN: "+r.status);
return parseInjuries(await r.json());
}

function injuryKind(s){
s=String(s||"").toLowerCase().replace(/[\s_-]/g,"");
if(["out","ir","injuredreserve","suspended","susp","seasonending"].includes(s))return "out";
if(["daytoday","questionable","doubtful","gametime","gtd"].includes(s))return "day";
return "other";
}

function getDate(g){return g.gameDate||g.date||""}

function completed(g){
return ["OFF","FINAL","OVER"].includes(
String(g.gameState||g.gameScheduleState||"").toUpperCase()
);
}

// Päivämäärien erotus kokonaisina kalenteripäivinä.
function diffDays(a,b){
const da=new Date(a+"T12:00:00");
const db=new Date(b+"T12:00:00");
return Math.round((db-da)/86400000);
}

function gameResult(g,code){
const home=g.homeTeam?.abbrev===code;
const own=home?g.homeTeam:g.awayTeam;
const opp=home?g.awayTeam:g.homeTeam;
if(!own||!opp)return null;

const ownScore=Number(own.score);
const oppScore=Number(opp.score);
if(!Number.isFinite(ownScore)||!Number.isFinite(oppScore))return null;

return {
date:getDate(g),
opponent:opp.abbrev||"?",
gf:ownScore,
ga:oppScore,
result:ownScore>oppScore?"V":ownScore<oppScore?"H":"JA",
home
};
}

// Mukaan otetaan vain valittua ottelupäivää edeltäneet pelit.
function recentGames(schedule,code,targetDate=today()){
return (schedule?.games||[])
.filter(completed)
.map(g=>gameResult(g,code))
.filter(Boolean)
.filter(g=>g.date<targetDate)
.sort((a,b)=>b.date.localeCompare(a.date));
}

function summary(games){
if(!games.length)return null;
const wins=games.filter(g=>g.result==="V").length;
const gf=games.reduce((s,g)=>s+g.gf,0);
const ga=games.reduce((s,g)=>s+g.ga,0);
return {
played:games.length,
wins,
losses:games.filter(g=>g.result==="H").length,
winRate:wins/games.length,
gf:gf/games.length,
ga:ga/games.length,
goalDiff:(gf-ga)/games.length
};
}

function getStanding(data,code){
return (data?.standings||[]).find(r=>
r.teamAbbrev?.default===code||r.teamAbbrev===code
)||null;
}

/*
Lepopäivät:
Jos viimeisin peli oli maanantaina ja seuraava ottelu keskiviikkona,
tiistai on yksi kokonainen lepopäivä.
Erotus 2 päivää - 1 = 1 lepopäivä.
*/
function fatigue(schedule,code,targetDate){
const games=recentGames(schedule,code,targetDate);
const last=games[0]?.date||null;

const gap=last?diffDays(last,targetDate):null;
const rest=gap===null?null:Math.max(0,gap-1);

// Lasketaan vain ottelua edeltävät kalenteripäivät.
const count=(days)=>games.filter(g=>{
const d=diffDays(g.date,targetDate);
return d>=1&&d<=days;
}).length;

const last4=count(4);
const last7=count(7);
const last10=count(10);

// Ottelu edellisenä kalenteripäivänä = 0 lepopäivää.
const backToBack=gap===1;

let penalty=0;
if(backToBack)penalty+=2.0;
if(last4>=3)penalty+=1.5;
if(last7>=4)penalty+=1.2;
if(last10>=5)penalty+=0.8;
if(rest!==null&&rest>=3)penalty-=0.5;

return {rest,last4,last7,last10,backToBack,penalty,lastGame:last};
}

function standingRank(v){
const n=Number(v);
return Number.isFinite(n)&&n>0?n+".":"–";
}

function standingsHTML(s){
if(!s)return `<p class="muted">Sarjataulukon tietoja ei saatu.</p>`;
return `
<div class="grid">
<div class="stat"><div class="small">Koko NHL</div><div class="rank">${standingRank(s.leagueSequence)}</div></div>
<div class="stat"><div class="small">Konferenssi</div><div class="rank">${standingRank(s.conferenceSequence)}</div></div>
<div class="stat"><div class="small">Pisteet</div><div class="value">${s.points??"–"}</div></div>
<div class="stat"><div class="small">Ottelut pelattu</div><div class="value">${s.gamesPlayed??"–"}</div></div>
<div class="stat"><div class="small">Voitot–tappiot–jatkoaikatappiot</div><div class="value">${s.wins??"–"}–${s.losses??"–"}–${s.otLosses??"–"}</div></div>
</div>`;
}

function fatigueHTML(f){
if(!f)return `<p class="muted">Rasitustietoja ei saatavilla.</p>`;
return `
<div class="grid">
<div class="stat">
<div class="small">Lepopäiviä ennen ottelua</div>
<div class="value">${f.rest===null?"–":f.rest}</div>
</div>
<div class="stat">
<div class="small">Otteluita edeltävänä 4 päivänä</div>
<div class="value">${f.last4}</div>
</div>
<div class="stat">
<div class="small">Otteluita edeltävänä 7 päivänä</div>
<div class="value">${f.last7}</div>
</div>
<div class="stat">
<div class="small">Otteluita edeltävänä 10 päivänä</div>
<div class="value">${f.last10}</div>
</div>
</div>
<p class="small">${f.lastGame?
"Viimeisin ottelu: "+esc(f.lastGame):
"Viimeisintä ottelua ei löytynyt."}</p>
<p class="small ${f.backToBack?"warn":"muted"}">
${f.backToBack?
"⚠ Peräkkäiset pelipäivät – rasitus huomioitu.":
"Ei peräkkäisten pelipäivien rasitusta."}
</p>`;
}

function injuriesHTML(list,code,ok){
if(!ok)return `<p class="warn">Loukkaantumistietojen haku epäonnistui.</p>`;
const rows=list.filter(i=>matchesTeam(i.team,code));
if(!rows.length)return `<p class="muted">ESPN:n raportissa ei löytynyt tämän joukkueen poissaoloja. Tämä ei takaa, että kaikki pelaajat ovat pelikunnossa.</p>`;
return rows.map(i=>{
const kind=injuryKind(i.status);
const tag=kind==="out"?"out":kind==="day"?"day":"";
return `<div class="injury">
<b>${esc(i.name)}</b> <span class="tag ${tag}">${esc(i.status)}</span>
<div class="small">${esc(i.position||"Pelipaikka ei tiedossa")} · ${esc(i.detail||"Lisätietoa ei ilmoitettu")}${i.returnDate?" · Arvioitu paluu: "+esc(i.returnDate):""}</div>
</div>`;
}).join("");
}

function injuryImpact(list,code,ok){
if(!ok)return null;
let impact=0;
const rows=list.filter(i=>matchesTeam(i.team,code));
for(const i of rows){
const kind=injuryKind(i.status);
const position=String(i.position||"").toUpperCase();
const goalie=position==="G";
if(kind==="out"){
impact+=goalie?5:1.6;
}else if(kind==="day"){
impact+=goalie?2.5:0.7;
}
}
return Math.min(8,impact);
}

function teamPanel(code,schedule,standing,injuries,injuryOK,targetDate){
const games=recentGames(schedule,code,targetDate);
const s=summary(games.slice(0,10));
const f=fatigue(schedule,code,targetDate);
const rows=games.slice(0,5).map(g=>`
<tr>
<td>${esc(g.date)}</td>
<td>${g.home?"vs":"@"} ${esc(g.opponent)}</td>
<td>${g.gf}–${g.ga}</td>
<td class="${g.result==="V"?"good":g.result==="H"?"bad":"warn"}">${g.result}</td>
</tr>`).join("");

return `
<div class="panel">
<h2>${esc(name(code))}</h2>
<h3>Sarjasijoitus</h3>
${standingsHTML(standing)}
<div class="section">
<h3>Viimeaikainen vire</h3>
<div class="grid">
<div class="stat"><div class="small">Viimeiset 10 ottelua ennen valittua päivää</div><div class="value">${s?s.wins+" voittoa":"–"}</div></div>
<div class="stat"><div class="small">Tehdyt / päästetyt maalit ottelussa</div><div class="value">${s?s.gf.toFixed(1)+" / "+s.ga.toFixed(1):"–"}</div></div>
</div>
</div>
<div class="section">
<h3>Ottelurasitus</h3>
${fatigueHTML(f)}
</div>
<div class="section">
<h3>Viimeiset viisi ottelua ennen valittua päivää</h3>
${rows?`<table><thead><tr><th>Päivä</th><th>Ottelu</th><th>Tulos</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<p class="muted">Ottelutietoja ei saatavilla.</p>`}
</div>
<div class="section">
<h3>Loukkaantumiset ja poissaolot</h3>
${injuriesHTML(injuries,code,injuryOK)}
</div>
<div class="section">
<h3>Maalivahti</h3>
<p class="muted">Aloittavaa maalivahtia ei ole vahvistettu. Sovellus ei arvaa maalivahtia.</p>
</div>
</div>`;
}

function prediction(statsA,statsB,standA,standB,fatA,fatB,injuryA,injuryB){
let score=0;
const reasons=[];

if(statsA&&statsB){
score+=(statsA.winRate-statsB.winRate)*24;
score+=(statsA.goalDiff-statsB.goalDiff)*2;
reasons.push("Viimeisten otteluiden vire ja maaliero");
}

if(standA&&standB){
const a=Number(standA.pointPctg),b=Number(standB.pointPctg);
if(Number.isFinite(a)&&Number.isFinite(b)){
score+=(a-b)*18;
reasons.push("Sarjataulukon pisteprosentti");
}
}

if(fatA&&fatB){
score+=(fatB.penalty-fatA.penalty)*1.5;
if(fatA.rest!==null&&fatB.rest!==null){
score+=Math.max(-3,Math.min(3,(fatB.rest-fatA.rest)*1.1));
}
reasons.push("Ottelurasitus ja lepopäivät");
}

if(injuryA!==null&&injuryB!==null){
score+=injuryB-injuryA;
reasons.push("Loukkaantumiset ja poissaolot");
}

score+=3;
const a=Math.max(10,Math.min(90,50+score));
return {a,b:100-a,reasons};
}

async function analyze(){
const a=$("teamA").value;
const b=$("teamB").value;
const targetDate=$("gameDate").value;

if(!targetDate){
setStatus("Valitse ottelupäivä.");
return;
}
if(a===b){
setStatus("Valitse kaksi eri joukkuetta.");
return;
}

const btn=$("analyzeBtn");
btn.disabled=true;
$("output").innerHTML="";
setStatus("Haetaan otteluita, sarjataulukkoa ja poissaoloja...");

try{
const [sa,sb,table,injuryResult]=await Promise.all([
fetchNHL(`/club-schedule-season/${a}/now`),
fetchNHL(`/club-schedule-season/${b}/now`),
fetchNHL("/standings/now"),
fetchInjuries().then(data=>({ok:true,data})).catch(error=>({ok:false,error}))
]);

const injuries=injuryResult.ok?injuryResult.data:[];
const ta=getStanding(table,a),tb=getStanding(table,b);

// Kaikki otteluhistoria rajataan valittuun ottelupäivään.
const ga=recentGames(sa,a,targetDate);
const gb=recentGames(sb,b,targetDate);
const sta=summary(ga.slice(0,10));
const stb=summary(gb.slice(0,10));
const fa=fatigue(sa,a,targetDate);
const fb=fatigue(sb,b,targetDate);

const ia=injuryImpact(injuries,a,injuryResult.ok);
const ib=injuryImpact(injuries,b,injuryResult.ok);

const p=prediction(sta,stb,ta,tb,fa,fb,ia,ib);

$("output").innerHTML=`
<div class="panel">
<h2>Ottelun voittaja-arvio</h2>
<p class="small">Analysoitava ottelupäivä: <b>${esc(targetDate)}</b></p>
<div class="grid">
<div class="stat">
<div class="small">${esc(name(a))}</div>
<div class="prob">${p.a.toFixed(1)} %</div>
<div class="bar"><span style="width:${p.a}%"></span></div>
</div>
<div class="stat">
<div class="small">${esc(name(b))}</div>
<div class="prob">${p.b.toFixed(1)} %</div>
<div class="bar"><span style="width:${p.b}%"></span></div>
</div>
</div>
<p class="note">Arvio huomioi viimeaikaisen vireen, sarjasijoituksen, lepopäivät, otteluruuhkan ja raportoidut poissaolot. Poissaolojen painotus on alustava: maalivahdin poissaolo vaikuttaa enemmän. Kotietu on mukana. Aloittavaa maalivahtia ei arvata.</p>
${ia!==null&&ib!==null?
`<p class="small">Poissaolojen arvioitu vaikutus: ${esc(name(a))} −${ia.toFixed(1)} · ${esc(name(b))} −${ib.toFixed(1)} prosenttiyksikköä.</p>`:
`<p class="small warn">Poissaolotietoja ei saatu, joten niitä ei huomioitu voittoprosentissa.</p>`}
<h3>Arviossa huomioidut tekijät</h3>
<p class="small">${p.reasons.map(esc).join(" · ")} · Kotietu</p>
</div>

<div class="grid">
${teamPanel(a,sa,ta,injuries,injuryResult.ok,targetDate)}
${teamPanel(b,sb,tb,injuries,injuryResult.ok,targetDate)}
</div>`;

setStatus(injuryResult.ok?
"Analyysi valmis ottelupäivälle "+targetDate+". Tarkista myös mahdolliset puutteet poissaoloraportissa.":
"Analyysi valmis, mutta ESPN:n poissaolotietoja ei saatu.");
}catch(e){
console.error(e);
setStatus("Tietojen haku epäonnistui: "+e.message+". Yritä hetken päästä uudelleen.");
}finally{
btn.disabled=false;
}
}

function init(){
const options=teams.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
$("teamA").innerHTML=options;
$("teamB").innerHTML=options;
$("teamA").value="WPG";
$("teamB").value="NJD";
$("gameDate").value=today();
}
init();
</script>
</body>
</html>
